[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Reproducible GGUF quantization quality, speed, and VRAM measurements"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noor Mkdad" }]
dependencies = []

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]
